<!-- app.html -->

<div class="min-vh-100 bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" routerLink="/">
                Gerenciamento de Produtos
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div
                id="navbarPrincipal"
                class="collapse navbar-collapse justify-content-end">

                <span class="navbar-text text-white">
                    Sistema de Controle
                </span>
            </div>

        </div>
    </nav>

    <!-- Layout principal -->
    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Sidebar -->
            <aside
                class="col-12 col-md-3 col-lg-2 bg-white border-end shadow-sm p-0">

                <div class="p-4 border-bottom">
                    <h5 class="text-primary fw-bold mb-1">
                        Menu principal
                    </h5>

                    <small class="text-secondary">
                        Navegação do sistema
                    </small>
                </div>

                <nav class="nav nav-pills flex-column gap-2 p-3">

                    <a
                        routerLink="/pages/dashboard"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                        class="nav-link fw-semibold">

                        Dashboard
                    </a>

                    <a
                        routerLink="/pages/cadastro-produto"
                        routerLinkActive="active"
                        class="nav-link fw-semibold">

                        Cadastro de produtos
                    </a>

                    <a
                        routerLink="/pages/consulta-produtos"
                        routerLinkActive="active"
                        class="nav-link fw-semibold">

                        Consulta de produtos
                    </a>

                </nav>

            </aside>

            <!-- Conteúdo central -->
            <main class="col-12 col-md-9 col-lg-10 p-4">

                <div class="bg-white rounded-4 shadow-sm border p-4 min-vh-100">
                    <router-outlet />
                </div>

            </main>

        </div>
    </div>

</div>
